plugins {
    id 'com.android.application'
}

android {
    namespace 'com.primeai.mobil'
    compileSdk 35

    defaultConfig {
        applicationId 'com.primeai.mobil'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '1.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
